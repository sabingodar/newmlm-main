<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import source data</title><link rel="stylesheet" href="/style.css"><script src="/import.js" defer></script></head><body><main class="settings-panel"><h1>Import source records</h1><p>One-time import. Sign in to the admin workspace first. Historical transactions are read-only and do not change stock.</p><label>Choose source JSON file<input id="source-file" type="file" accept=".json,application/json"></label><form id="import-form"><label>Source JSON<textarea id="source-json" required></textarea></label><button type="button" class="button" id="save-snapshot">Save snapshot</button><button class="primary">Import data</button></form><pre id="result" role="status"></pre><a href="/admin">Return to dashboard</a></main></body></html>
