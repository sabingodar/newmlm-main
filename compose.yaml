services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: dynamic_life
      POSTGRES_USER: dls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dls -d dynamic_life"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
